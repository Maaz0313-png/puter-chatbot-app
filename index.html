<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplex — Multi-Model AI Chat</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">Multiplex</span>
    </div>

    <div class="model-picker">
      <label for="modelSelect" class="model-picker-label">Model</label>
      <select id="modelSelect">
        <optgroup label="Flagship">
          <option value="anthropic/claude-opus-5" data-provider="Anthropic">Claude Opus 5 — Anthropic</option>
          <option value="google/gemini-3.6-flash" data-provider="Google" selected>Gemini 3.6 Flash — Google</option>
        </optgroup>
        <optgroup label="Open-Source">
          <option value="z-ai/glm-5.2" data-provider="Z.AI">GLM 5.2 — Z.AI</option>
          <option value="deepseek/deepseek-v4-pro" data-provider="DeepSeek">DeepSeek V4 Pro — DeepSeek</option>
          <option value="qwen/qwen3.7-max" data-provider="Qwen">Qwen 3.7 Max — Qwen</option>
          <option value="mistralai/mistral-small-2603" data-provider="Mistral">Mistral Small 4 — Mistral</option>
          <option value="moonshotai/kimi-k2.6" data-provider="Moonshot">Kimi K2.6 — Moonshot AI</option>
          <option value="google/gemma-4-31b-it" data-provider="Google">Gemma 4 31B — Google</option>
          <option value="meta-llama/llama-4-maverick" data-provider="Meta">Llama 4 Maverick — Meta</option>
          <option value="microsoft/phi-4" data-provider="Microsoft">Phi-4 — Microsoft</option>
        </optgroup>
      </select>
    </div>

    <button id="clearBtn" class="clear-btn" title="Clear conversation">Clear</button>
  </header>

  <main id="chatLog" class="chat-log">
    <div class="empty-state" id="emptyState">
      <div class="empty-glyph">◆</div>
      <p>Pick a model above and start a conversation.</p>
      <p class="empty-sub">Every reply is rendered from Markdown.</p>
    </div>
  </main>

  <form id="composer" class="composer">
    <textarea id="promptInput" placeholder="Message the model…" rows="1" autofocus></textarea>
    <button type="submit" id="sendBtn" class="send-btn" aria-label="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </form>

</div>

<script src="https://js.puter.com/v2/"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="script.js"></script>
</body>
</html>
